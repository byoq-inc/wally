name: validate-sanitized-export

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate export
        run: ./tests/check-export.sh

  azure-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.1
      - run: tofu -chdir=infra/azure fmt -check
      - run: tofu -chdir=infra/azure init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir=infra/azure validate
      - run: tofu -chdir=infra/azure test
