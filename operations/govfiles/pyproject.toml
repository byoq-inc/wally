[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "govfiles-proposal-agent"
version = "0.2.0"
description = "Proposal-only Calendar to Granola to Signal service"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
govfiles-proposals = "proposal_agent.cli:main"

[tool.setuptools.packages.find]
include = ["granola_readonly*", "proposal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["granola_readonly", "proposal_agent"]
